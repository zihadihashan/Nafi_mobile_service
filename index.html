<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
    <title>মাওয়া নাফি টেলিকম</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1a73e8">

    <style>
        :root {
            --bg: #0d1b4b;
            --blue: #1a73e8;
            --card: #16245a;
            --white: #ffffff;
        }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: var(--white); margin: 0; padding: 0; }
        .header { background: linear-gradient(135deg, var(--blue), #004ba0); padding: 40px 20px; text-align: center; border-radius: 0 0 25px 25px; box-shadow: 0 4px 15px rgba(0,0,0,0.3); }
        .container { padding: 20px; max-width: 500px; margin: -30px auto 0; }
        .card { background: var(--card); padding: 20px; margin-bottom: 20px; border-radius: 15px; border-left: 5px solid var(--blue); box-shadow: 0 4px 10px rgba(0,0,0,0.2); }
        .btn { display: block; width: 100%; padding: 15px; text-align: center; border-radius: 50px; text-decoration: none; font-weight: bold; margin-top: 15px; cursor: pointer; border: none; font-size: 1.1rem; }
        .btn-call { background: #28a745; color: white; }
        
        /* Login & Admin Panel */
        #login-section, #admin-panel { display: none; margin-top: 30px; background: #fff; color: #333; padding: 25px; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        input { width: 90%; padding: 12px; margin: 10px 0; border: 1px solid #ccc; border-radius: 8px; font-size: 1rem; }
        .status-badge { display: inline-block; padding: 5px 15px; border-radius: 20px; font-size: 0.8rem; font-weight: bold; margin-bottom: 15px; }
        .admin-badge { background: #ffd700; color: #000; }
        .sub-badge { background: #1a73e8; color: #fff; }
    </style>
</head>
<body>

    <div id="main-site">
        <header class="header">
            <h1>মাওয়া নাফি টেলিকম</h1>
            <p>মোবাইল সার্ভিসিং ও টেলিকম সেন্টার</p>
        </header>

        <div class="container">
            <div class="card">
                <h3>🛠 সার্ভিসিং</h3>
                <p>সব ধরণের স্মার্টফোন ও বাটন ফোনের নিখুঁত মেরামত।</p>
            </div>
            
            <a href="tel:+8801700000000" class="btn btn-call">📞 এখনই কল করুন</a>
            <button onclick="showLogin()" class="btn" style="background: #6c757d; color: white; font-size: 0.9rem;">Staff Login</button>
        </div>
    </div>

    <div id="login-section" class="container">
        <h2 style="color: var(--blue); margin-top: 0;">লগইন করুন</h2>
        <input type="text" id="username" placeholder="ইউজারনেম">
        <input type="password" id="password" placeholder="পাসওয়ার্ড">
        <button onclick="handleLogin()" class="btn" style="background: var(--blue); color:white;">প্রবেশ করুন</button>
        <button onclick="hideLogin()" class="btn" style="background: #eee; color:#333;">ফিরে যান</button>
    </div>

    <div id="admin-panel" class="container">
        <div id="role-badge" class="status-badge"></div>
        <h2 id="welcome-text" style="margin: 0 0 10px 0;"></h2>
        <p>নাফি টেলিকম ম্যানেজমেন্ট ড্যাশবোর্ডে আপনাকে স্বাগতম।</p>
        
        <div id="admin-only" style="display:none; border-top: 2px solid #eee; padding-top: 15px; margin-top: 15px;">
            <h4 style="color: red;">অ্যাডমিন স্পেশাল কন্ট্রোল:</h4>
            <p>✅ আপনি সব রিপোর্ট ডিলিট ও এডিট করতে পারবেন।</p>
        </div>

        <button onclick="logout()" class="btn" style="background: red; color:white;">লগআউট</button>
    </div>

    <script>
        // PWA Registration
        if ('serviceWorker' in navigator) { navigator.serviceWorker.register('sw.js'); }

        function showLogin() {
            document.getElementById('main-site').style.display = 'none';
            document.getElementById('login-section').style.display = 'block';
        }

        function hideLogin() {
            document.getElementById('login-section').style.display = 'none';
            document.getElementById('main-site').style.display = 'block';
        }

        function handleLogin() {
            const user = document.getElementById('username').value;
            const pass = document.getElementById('password').value;
            const badge = document.getElementById('role-badge');
            const adminOnly = document.getElementById('admin-only');

            // Admin Logic
            if(user === 'admin' && pass === 'nafi786') {
                showDashboard('Main Admin', 'admin-badge', true);
            } 
            // Sub Admin Logic
            else if(user === 'subadmin' && pass === 'nafi123') {
                showDashboard('Sub Admin (Nafi)', 'sub-badge', false);
            } 
            else {
                alert('ভুল ইউজারনেম বা পাসওয়ার্ড!');
            }
        }

        function showDashboard(name, badgeClass, isAdmin) {
            document.getElementById('login-section').style.display = 'none';
            document.getElementById('admin-panel').style.display = 'block';
            document.getElementById('welcome-text').innerText = "স্বাগতম, " + name;
            
            const badge = document.getElementById('role-badge');
            badge.innerText = isAdmin ? "FULL ACCESS" : "LIMITED ACCESS";
            badge.className = "status-badge " + badgeClass;
            
            document.getElementById('admin-only').style.display = isAdmin ? 'block' : 'none';
        }

        function logout() { location.reload(); }
    </script>
</body>
</html>
